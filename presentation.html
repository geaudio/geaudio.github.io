<!DOCTYPE html>
<html>
<head>
    <title>GEAUDIO - Réalisations</title>
    <!-- Lien Google Fonts (Nohemi) -->
    <link href="https://fonts.googleapis.com/css2?family=Nohemi&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nohemi', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #ffffff;
            color: #1a1a1a;
        }

        /* Lignes verticales sur la gauche */
        .lines-container {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 12%;
            width: 27px;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
        }

        .vertical-line {
            width: 3px;
            height: 100%;
        }

        .line-red { background-color: #CF3636; }
        .line-yellow { background-color: #FDD107; }
        .line-blue { background-color: #3881E2; }

        header {
            position: relative;
            z-index: 10;
        }

        /* Style du Logo */
        .logo {
            position: absolute;
            top: 20px;
            right: 20px;
            max-width: 200px;
            height: auto;
        }

        /* Style du Menu */
        .menu {
            margin-top: 30px;
            margin-bottom: 80px;
            text-align: center;
        }

        .menu a {
            font-family: 'Nohemi', sans-serif;
            text-transform: uppercase;
            text-decoration: none;
            color: #1a1a1a;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 0 20px;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .menu a:hover {
            color: #666666;
        }

        /* Contenu */
        .content {
            max-width: 700px;
            margin: 0 auto;
            padding: 0 20px;
        }

        h1 {
            font-size: 36px;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .confirmation-text {
            font-size: 18px;
            color: #666666;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="lines-container">
        <div class="vertical-line line-red"></div>
        <div class="vertical-line line-yellow"></div>
        <div class="vertical-line line-blue"></div>
    </div>

    <header>
        <img src="assets/images/LOGO.png" alt="Mon Logo" class="logo">
        
<nav class="menu">
    <a href="index.html">Accueil</a>
    <a href="audiobank.html">Extraits Audio</a>
    <a href="presentation.html">Présentation</a>
    <a href="projets.html">Projets</a>
    <a href="depot.html">Dépôt</a>
</nav>
    </header>

    <main class="content">
        <h1>RÉALISATIONS</h1>
        <p class="confirmation-text">
            Tu es bien sur la page dédiée à ma présentation. Le lien fonctionne parfaitement !
        </p>
    </main>

</body>
</html>
