<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GEAUDIO - Accueil</title>
    <!-- Liens Google Fonts (Importation des différentes graisses de Nohemi : 200/Extra-Light, 300/Light, 800/Extra-Bold) -->
    <link href="https://fonts.googleapis.com/css2?family=Nohemi:wght@200;300;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Nohemi', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #ffffff;
            color: #1a1a1a;
            min-height: 100vh;
            position: relative;
        }

        /* ----------------------------------------------------
           AJOUT : Les 3 fines lignes verticales (de gauche à droite)
           ---------------------------------------------------- */
        .lines-container {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 15%; /* Ajuste ce pourcentage si tu veux décaler le bloc de lignes vers le centre ou le bord */
            width: 30px; /* Espace global contenant les 3 lignes */
            height: 100vh;
            z-index: 1; /* Reste en arrière-plan sous les textes */
            pointer-events: none; /* Permet de cliquer à travers les lignes sans bloquer le site */
            display: flex;
            justify-content: space-between;
        }

        .vertical-line {
            width: 3.5px;
            height: 100%;
        }

        .line-red { background-color: #CF3636; }
        .line-yellow { background-color: #FDD107; }
        .line-blue { background-color: #3881E2; }

        /* ----------------------------------------------------
           Structure et Navigation
           ---------------------------------------------------- */
        header {
            position: relative;
            z-index: 10;
        }

        /* Style du Logo en haut à droite */
        .logo {
            position: absolute;
            top: 20px;
            right: 20px;
            max-width: 200px; /* Limité à 200px max */
            height: auto;
        }

        /* Style du Menu */
        .menu {
            margin-top: 30px;
            margin-bottom: 80px;
            text-align: center;
        }

        .menu a {
            font-family: 'Nohemi', sans-serif;
            text-transform: uppercase;
            text-decoration: none;
            color: #1a1a1a;
            font-weight: 800; /* Nohemi Extra Bold pour le menu pour garder du caractère */
            letter-spacing: 2px;
            margin: 0 20px;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .menu a:hover {
            color: #666666;
        }

        /* Contenu Principal */
        .content {
            max-width: 700px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        /* ----------------------------------------------------
           Typographies demandées
           ---------------------------------------------------- */
        
        /* Titre en Nohemi Extra Bold */
        h1 {
            font-size: 54px;
            font-weight: 800; 
            letter-spacing: 4px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        /* Sous-titre en Nohemi Light */
        .subtitle {
            font-size: 18px;
            font-weight: 300; 
            color: #666666;
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Reste du texte en Nohemi Extra Light */
        .description {
            font-size: 18px;
            font-weight: 200; 
            line-height: 1.6;
            margin-bottom: 40px;
            letter-spacing: 0.5px;
        }

        /* ----------------------------------------------------
           SOLUTION SIGNATURE MANUSCRITE (IMAGE)
           ---------------------------------------------------- */
        .signature-container {
            margin-top: 20px;
            display: inline-block;
        }

        .signature-img {
            max-width: 150px; /* Ajuste la largeur de ta signature ici */
            height: auto;
            /* L'effet de rotation légère est conservé pour le réalisme */
            transform: rotate(-3deg); 
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <!-- Container des 3 lignes verticales -->
    <div class="lines-container">
        <div class="vertical-line line-red"></div>
        <div class="vertical-line line-yellow"></div>
        <div class="vertical-line line-blue"></div>
    </div>

    <header>
        <!-- Logo -->
        <img src="assets/images/LOGO.png" alt="Mon Logo" class="logo">
        
        <!-- Menu -->
        <nav class="menu">
            <a href="index.html">Accueil</a>
            <a href="audiobank.html">Extraits Audio</a>
            <a href="presentation.html">Présentation</a>
            <a href="projets.html">Projets</a>
            <a href="depot.html">Dépôt</a>
        </nav>
    </header>

    <!-- Présentation -->
    <main class="content">
        <h1>GEAUDIO</h1>
        <div class="subtitle">Quand l'audio est au centre</div>
        
        <p class="description">
            Bienvenue sur mon site, ici tu peux accéder à mes dernières créations, en savoir plus sur moi et déposer tes fichiers.
        </p>
        
        <!-- Zone de la Signature intégrée à partir de ton fichier -->
        <div class="signature-container">
            <img src="assets/images/signature.png" alt="Signature Genès" class="signature-img">
        </div>
    </main>

</body>
</html>
