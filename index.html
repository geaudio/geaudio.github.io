<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GEAUDIO - Accueil</title>
    <!-- Liens Google Fonts (Nohemi + Pinyon Script pour la signature style vieux livre / plume) -->
    <link href="https://fonts.googleapis.com/css2?family=Nohemi:wght@400;700;900&family=Pinyon+Script&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nohemi', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #ffffff;
            color: #1a1a1a;
        }

        /* Style du Logo en haut à droite */
        .logo {
            position: absolute;
            top: 20px;
            right: 20px;
            max-width: 200px; /* Réduit à 200px max */
            height: auto;
        }

        /* Style du Menu en Majuscules */
        .menu {
            margin-top: 30px;
            margin-bottom: 80px;
            text-align: center;
        }

        .menu a {
            font-family: 'Nohemi', sans-serif;
            text-transform: uppercase;
            text-decoration: none;
            color: #1a1a1a;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 0 20px;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .menu a:hover {
            color: #666666;
        }

        /* Contenu Principal */
        .content {
            max-width: 700px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* GEAUDIO plus droit, plus massif et plus typé titre */
        h1 {
            font-size: 54px;
            font-weight: 900; /* Force le caractère très droit et massif de la police */
            letter-spacing: 6px; /* Accentue l'effet bloc/titre */
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 18px;
            color: #666666;
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .description {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        /* Style de la Signature "Vieux Livre / Plume" */
        .signature {
            font-family: 'Pinyon Script', cursive;
            font-size: 48px; /* Légèrement agrandie car cette police est plus fine */
            color: #1a1a1a;
            margin-top: 20px;
            display: inline-block;
            transform: rotate(-3deg); /* Donne un petit effet de signature naturelle à la main */
        }
    </style>
</head>
<body>

    <header>
        <!-- Logo -->
        <img src="assets/images/LOGO.png" alt="Mon Logo" class="logo">
        
        <!-- Menu -->
        <nav class="menu">
            <a href="index.html">Accueil</a>
            <a href="audiobank.html">Extraits Audio</a>
            <a href="presentation.html">Présentation</a>
            <a href="projets.html">Projets</a>
            <a href="depot.html">Dépôt</a>
        </nav>
    </header>

    <!-- Présentation -->
    <main class="content">
        <h1>GEAUDIO</h1>
        <div class="subtitle">Quand l'audio est au centre</div>
        
        <p class="description">
            Bienvenue sur mon site, ici tu peux accéder à mes dernières créations, en savoir plus sur moi et déposer tes fichiers.
        </p>
        
        <div class="signature">Genès</div>
    </main>

</body>
</html>
